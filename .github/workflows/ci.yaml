name: CI

on:
  push:
    branches: [ "main", "wip" ]
  pull_request:
    branches: [ "main", "wip" ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Privacy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version

      - name: Scan git history with Gitleaks
        run: gitleaks git --log-opts="HEAD" --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan working directory with Gitleaks
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner --verbose

  test-go:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install gcloud and firestore emulator
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: 'cloud-firestore-emulator'

      - name: Start Firestore Emulator
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8087 --quiet &
          # Wait for the emulator to be ready
          count=0
          until curl -s http://127.0.0.1:8087/ > /dev/null; do
            echo "Waiting for Firestore Emulator..."
            sleep 1
            count=$((count+1))
            if [ $count -ge 30 ]; then
              echo "Timeout waiting for Firestore Emulator"
              exit 1
            fi
          done
          echo "Firestore Emulator started."

      - name: Check Go formatting
        run: go fmt ./... && git diff --exit-code

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Tests
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8087"
        run: go test -race -short -skip '^Test(Plan|Energy)History$' ./...

      - name: Run Controller History Replays
        run: go test ./pkg/controller -run '^Test(Plan|Energy)History$'

  test-web:
    name: Run Web Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web code
        run: npm run lint

      - name: Type check web code
        run: npm run type-check

      - name: Run Web Tests
        run: npx vitest run --maxWorkers=2

      - name: Build web bundle
        run: npm run build

      - name: Verify web build output
        run: |
          for file in \
            dist/index.html \
            dist/sw.js \
            dist/how-it-works.html \
            dist/getting-started.html \
            dist/utilities.html \
            dist/changelog.html \
            dist/privacy.html \
            dist/terms.html; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty expected build output: web/$file"
              exit 1
            fi
          done
          if [ -e dist/stats.html ]; then
            echo "Unexpected bundle analyzer output found in production build: web/dist/stats.html"
            exit 1
          fi

      - name: Upload web build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    needs: [test-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Prepare web/dist directory
        run: rm -rf web/dist

      - name: Download web build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - name: Verify embedded web assets
        run: |
          test -s web/dist/index.html
          test -s web/dist/sw.js
          test ! -e web/dist/stats.html

      - name: Build raterudder server binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -tags timetzdata -trimpath -ldflags='-s -w' -o "${RUNNER_TEMP}/raterudder" ./cmd/raterudder
          test -x "${RUNNER_TEMP}/raterudder"

      - name: Build CLI binaries
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          go build -tags timetzdata -o "${RUNNER_TEMP}/bin/" ./cmd/...
          checked=0
          for dir in cmd/*/; do
            [ -d "${dir}" ] || continue
            bin="$(basename "${dir}")"
            test -x "${RUNNER_TEMP}/bin/${bin}"
            checked=$((checked + 1))
          done
          test "${checked}" -gt 0

  smoke-container:
    name: Build & Smoke Test Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: raterudder:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run live container smoke checks
        run: ./scripts/smoke-container.sh raterudder:smoke
