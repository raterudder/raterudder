name: Live API Tests

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-live-apis:
    name: Run Live Provider API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run Live Weather and Utility API Tests
        env:
          RATERUDDER_LIVE_API_TESTS: "1"
        run: go test ./pkg/weather ./pkg/utility -run '^Test(OpenMeteoService|OctopusUtility|ComEd|Ameren)$/^Integration_Real'
